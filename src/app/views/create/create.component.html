<div class="container" [ngClass]="{ 'container-loading': loaded }">
  <div class="event-date">
    <app-date-picker
      [eventStyle]="eventStyle"
      (datesSelected)="onDatesSelected($event)"
    ></app-date-picker>
  </div>
  <div class="event-info">
    <input
      class="input"
      id="name"
      type="text"
      placeholder="Event name"
      style="border-top-left-radius: 5px"
      [(ngModel)]="eventName"
    />
    <input
      class="input"
      id="name"
      type="text"
      placeholder="Your Name"
      style="border-top-left-radius: 5px"
      [(ngModel)]="eventCreator"
    />
    <div class="event-styles">
      <button
        [ngClass]="{ selected: eventStyle == 'specific' }"
        (click)="changeEventStyle('specific')"
      >
        Specific
      </button>
      <button
        [ngClass]="{ selected: eventStyle == 'broad' }"
        (click)="changeEventStyle('broad')"
        style="border-bottom-left-radius: 5px; border-bottom-right-radius: 5px"
      >
        Broad
      </button>
    </div>
    @if (eventStyle == 'specific') {
    <div class="time-pick">
      <select name="" id="" [(ngModel)]="startTime">
        <option *ngFor="let time of times">
          {{ time | date : "shortTime" }}
        </option>
      </select>
      <select name="" id="" [(ngModel)]="endTime">
        <!-- adding selected sets it to the bottom of the dropdown for some reason -->
        <option *ngFor="let time of times" selected>
          {{ time | date : "shortTime" }}
        </option>
      </select>
    </div>
    }
    <button class="create" (click)="isEventValid()">Create</button>
  </div>
</div>
<div class="preview" *ngIf="selectedDates.length">
  <h2>Dates Selected</h2>
  <div class="dates">
    @for (date of selectedDates; track $index) {
    <div class="date">
      <span
        >{{ date | date : "fullDate" }} {{ startTime }}
        <span *ngIf="endTime"> - </span> {{ endTime }}</span
      >
    </div>
    }
  </div>
</div>
